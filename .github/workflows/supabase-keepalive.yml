name: Supabase Keep-Alive

# Supabase free-tier projects auto-pause after 7 days with no activity.
#
# v1 of this workflow used the public anon key to SELECT from `leads`, but RLS
# only grants that table to the `authenticated` role — so every ping got a
# real HTTP 200 while PostgREST silently filtered the result to zero rows.
# In practice that did NOT count as "activity" to Supabase's pause detector:
# the project was paused again despite the workflow succeeding on schedule.
#
# Fix: perform a genuine WRITE (an UPDATE, not a filtered-to-nothing read)
# against a dedicated `public._keepalive` heartbeat row, using the
# service_role key (stored as the SUPABASE_SERVICE_ROLE_KEY repo secret,
# never committed) since RLS blocks anon/authenticated writes entirely.

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write heartbeat to Supabase
        env:
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" \
            -X PATCH "https://grkqbudhjxxewrhpdjtz.supabase.co/rest/v1/_keepalive?id=eq.1" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"pinged_at":"now()"}'
