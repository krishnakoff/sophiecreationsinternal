name: Supabase Keep-Alive

# Supabase free-tier projects auto-pause after 7 days with no activity.
# This pings the REST API every 3 days (well inside that window) so
# Sophie Internal never gets paused. Uses the anon key already committed
# in config.js (documented there as safe to be public) — no secrets needed.

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase REST API
        run: |
          ANON_KEY=$(grep SUPABASE_ANON_KEY config.js | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" \
            "https://grkqbudhjxxewrhpdjtz.supabase.co/rest/v1/leads?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY"
